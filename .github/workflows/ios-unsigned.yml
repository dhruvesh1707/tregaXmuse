# Builds an UNSIGNED release IPA for Trega on a GitHub-hosted Mac runner.
#
# Why: Flutter iOS builds require macOS/Xcode, which can't run on a Windows
# PC. Sideloadly (Windows) only installs IPAs, it can't build them.
# This workflow produces the IPA; Sideloadly then signs it with a personal
# Apple ID for sideloading.
#
# Prerequisite (one-time, on the dev PC) — the cloud runner needs these
# generated files in the repo:
#   git add -f trega_app/ios trega_app/lib/firebase_options.dart
#   git commit -m "Add iOS project and Firebase options for cloud build"
#   git push
#
# Usage: GitHub repo -> Actions tab -> "iOS unsigned IPA" ->
# Run workflow -> download the Trega-unsigned artifact when it finishes.
#
# Cost note: the repo is private, so macOS minutes bill at 10x against the
# 2,000 free Actions minutes/month (~200 macOS minutes). First build takes
# ~20-30 min (Xcode + CocoaPods), later builds ~8-12 min with cache.
# Set a spending limit in Settings -> Billing to avoid overage surprises.
name: iOS unsigned IPA

on:
  workflow_dispatch: # manual trigger only — each run costs macOS minutes

concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        # The Firebase iOS SDK now uses Swift 6 features (e.g. `sending`);
        # the runner image's default Xcode can lag behind, so pin the newest
        # installed Xcode explicitly.
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Drop stale machine-generated iOS files
        # ios/Flutter/Generated.xcconfig, flutter_export_environment.sh and
        # ios/Flutter/ephemeral/ are generated per machine and must never be
        # committed (the ios/.gitignore already excludes them), but they got
        # force-added once with Windows paths (FLUTTER_ROOT=C:\src\flutter).
        # Delete them so `flutter pub get` regenerates them for this runner.
        run: |
          cd trega_app/ios
          rm -f Flutter/Generated.xcconfig Flutter/flutter_export_environment.sh
          rm -rf Flutter/ephemeral

      - name: Install Dart dependencies
        run: cd trega_app && flutter pub get

      - name: Install CocoaPods dependencies
        run: cd trega_app/ios && pod install --repo-update

      - name: Build unsigned IPA with xcodebuild
        # `flutter build ios` hard-requires a Development Team selected in the
        # Xcode project before it will finish — even with --no-codesign — which
        # is impossible on a CI runner for a sideload build. So let Flutter
        # only prepare the Xcode project, then drive xcodebuild directly with
        # signing disabled and package the .app into an IPA that Sideloadly
        # can sign with a personal Apple ID.
        # NOTE: --config-only alone still runs the pre-build certificate check
        # (codesign defaults to true), so --no-codesign must be passed too.
        run: |
          cd trega_app
          flutter build ios --release --config-only --no-codesign
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build/ios/deriveddata" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            build
          APP="$PWD/build/ios/deriveddata/Build/Products/Release-iphoneos/Runner.app"
          test -d "$APP" || { echo "Runner.app not found at $APP"; exit 1; }
          rm -rf Payload Trega-unsigned.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -r -y Trega-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Trega-unsigned
          path: trega_app/Trega-unsigned.ipa
          retention-days: 7
