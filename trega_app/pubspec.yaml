name: trega
description: Trega — India's peer-to-peer marketplace for pre-owned gear. Buy, sell & bid on gaming, mobiles, laptops, cameras and music gear.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Firebase (primary backend — project: tregaxmuse)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.6
  firebase_messaging: ^15.1.5
  cloud_functions: ^5.1.3

  # Networking (DEPRECATED: kept only as fallback for legacy REST endpoints.
  # All new code must use Firebase via lib/core/firebase/. Do not add new Dio calls.)
  dio: ^5.7.0

  # Media
  image_picker: ^1.1.2
  image_cropper: ^12.2.1 # profile photo crop only — gallery stays out of the sell flow

  # iOS-style UI: Phosphor icon set (vendored — phosphor_flutter 2.0.x can't
  # compile on current Flutter stable because IconData is now final; the same
  # OFL glyphs live in lib/core/icons/phosphor_icons.dart + assets/fonts/)
  # and iOS-animated modal bottom sheets.
  modal_bottom_sheet: ^3.0.0
  video_player: ^2.9.2
  cached_network_image: ^3.4.1

  # Utilities
  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  # Deep links: trega://listing/<id> from shared listing links.
  app_links: ^6.4.1

  # Observability — Firebase Crashlytics (crash reporting) + Firebase
  # Performance Monitoring (app-start, screen & network traces). Zero-config:
  # both ride on the existing tregaxmuse Firebase project, no keys needed.
  firebase_crashlytics: ^4.1.0
  firebase_performance: ^0.10.0

  # Premium UI/UX — presentation layer only. These packages must never
  # change workflows, routes, Firestore fields or callable names.
  # All pinned exact (like the Cashfree SDK): UI packages have broken
  # release builds on surprise minor updates before.
  flutter_animate: 4.5.2 # chainable entrances, staggered lists, micro-interactions
  page_transition: 2.2.2 # per-route transitions (modal slide-ups), Navigator 1.0 native
  another_flushbar: 2.2.4 # floating gradient toasts (replaces plain SnackBars)
  skeletonizer: 3.0.0 # auto skeleton loaders from real layouts (zero native code)
  pinput: 6.0.2 # animated OTP pin fields (phone auth + Aadhaar)
  photo_view: 0.15.0 # pinch/zoom gallery viewer for listing photos
  smooth_page_indicator: 2.0.1 # iOS-grade animated carousel dots
  flutter_slidable: 4.0.3 # iOS-style swipe actions on lists
  easy_refresh: 3.5.1 # spring-physics pull-to-refresh
  timelines_plus: 2.0.1 # order-tracking stepper timeline

  # Payments — Cashfree PG drop checkout (Android/iOS).
  # NOTE: the SDK environment below (PRODUCTION) must match the backend
  # `CASHFREE_ENV` secret in trega_functions.
  # IMPORTANT: the package is `flutter_cashfree_pg_sdk` (Cashfree's current
  # SDK). The old `cashfree_pg` package is discontinued (2022, Dart 2-only)
  # and has a completely different Dart API — do NOT switch back.
  # Pinned exact: Cashfree has replaced SDK packages before, so never let
  # this float on ^.
  flutter_cashfree_pg_sdk: 2.4.0+52

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo/trega_app_icon.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#ffffff"
  image: "assets/logo/trega_logo.png"
  android: true
  ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/logo/

  fonts:
    - family: PhosphorRegular
      fonts:
        - asset: assets/fonts/Phosphor.ttf
          weight: 400
    - family: PhosphorFill
      fonts:
        - asset: assets/fonts/Phosphor-Fill.ttf
          weight: 400
